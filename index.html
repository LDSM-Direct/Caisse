<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050d18">
<meta name="robots" content="noindex,nofollow">
<title>Caisse LDSM — 19e promotion</title>
<style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
--navy:#050d18;--navy2:#0a1828;--panel:#0d1f33;--panel2:#14283e;--line:#1e3a54;
--gold:#c8a04a;--goldl:#e8c97a;--tx:#e9eef5;--mut:#8ba0b8;
--ok:#4ade80;--bad:#f87171;--warn:#fbbf24;
--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
--serif:Georgia,"Times New Roman",serif;
}
body{background:var(--navy);color:var(--tx);font-family:var(--sans);font-size:14px;line-height:1.5;
-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
.sr{position:absolute;left:-9999px}

/* ---------- ECRAN D'ACCES ---------- */
#login{min-height:100vh;display:grid;place-items:center;padding:28px 14px;
background:radial-gradient(ellipse at 50% 0%,#0f2740 0%,#050d18 62%)}
.lbox{width:100%;max-width:430px;text-align:center}
.crest{width:112px;height:112px;margin:0 auto 14px;border-radius:50%;background:#fff;
padding:5px;box-shadow:0 0 0 1px var(--gold),0 0 0 6px rgba(200,160,74,.14),0 14px 40px rgba(0,0,0,.6)}
.crest img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.corps{font-family:var(--serif);font-size:11px;letter-spacing:2.6px;color:var(--gold);text-transform:uppercase}
.appname{font-family:var(--serif);font-size:27px;font-weight:700;letter-spacing:3px;margin:7px 0 3px}
.exo{font-size:11px;letter-spacing:1.6px;color:var(--mut);text-transform:uppercase}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:16px 0}
.classif{font-size:9px;letter-spacing:2.2px;color:#6d8097;text-transform:uppercase;
border:1px solid var(--line);border-radius:3px;padding:4px 9px;display:inline-block;margin-bottom:18px}
.rsel{font-size:10px;letter-spacing:2px;color:var(--mut);text-transform:uppercase;margin-bottom:11px}
.rl{display:grid;gap:8px;text-align:left}
.rc{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);
border-left:3px solid var(--gold);border-radius:4px;padding:12px 13px;cursor:pointer;transition:.15s}
.rc:active,.rc:hover{background:var(--panel2);border-left-color:var(--goldl)}
.chev{font-family:var(--serif);color:var(--gold);font-size:15px;line-height:1;letter-spacing:-3px;flex:none;width:28px}
.rc b{display:block;font-size:13px;letter-spacing:.9px;text-transform:uppercase}
.rc span{display:block;font-size:11px;color:var(--mut);margin-top:1px}
.pin{display:none;margin-top:14px}
.pin.on{display:block}
.pin input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:4px;color:var(--tx);
padding:13px;text-align:center;font-size:21px;letter-spacing:9px;font-family:var(--serif);outline:none}
.pin input:focus{border-color:var(--gold)}
.pin .err{color:var(--bad);font-size:11.5px;margin-top:7px;min-height:15px;text-align:center}
.btn{width:100%;background:var(--gold);border:0;color:#1a1200;padding:13px;border-radius:4px;
font-size:12px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;font-family:inherit;cursor:pointer;margin-top:9px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--mut)}
.demo{margin-top:16px;font-size:10.5px;color:#5d7086;line-height:1.7}

/* ---------- APP ---------- */
#app{display:none;padding-bottom:78px}
#app.on{display:block}
header{background:linear-gradient(180deg,#0e2743,#071425);border-bottom:1px solid var(--gold);
padding:11px 0 10px;position:sticky;top:0;z-index:20}
.hrow{display:flex;align-items:center;gap:11px}
.hcrest{width:38px;height:38px;border-radius:50%;background:#fff;padding:2px;flex:none}
.hcrest img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.htit{flex:1;min-width:0}
.htit b{font-family:var(--serif);font-size:14px;letter-spacing:1.4px;display:block}
.htit span{font-size:9.5px;letter-spacing:1.3px;color:var(--mut);text-transform:uppercase}
.badge{font-size:9px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;padding:5px 8px;
border:1px solid var(--gold);color:var(--gold);border-radius:3px;white-space:nowrap;flex:none;cursor:pointer}

h2{font-family:var(--serif);font-size:12px;letter-spacing:2.4px;text-transform:uppercase;
color:var(--goldl);margin:20px 0 10px;display:flex;align-items:center;gap:8px}
h2:before{content:"";width:6px;height:6px;background:var(--gold);transform:rotate(45deg);flex:none}
h2 small{margin-left:auto;font-family:var(--sans);font-size:10px;letter-spacing:.4px;
color:var(--mut);text-transform:none}

.card{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:14px;margin-bottom:9px}
.lbl{font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut);font-weight:700}
.num{font-variant-numeric:tabular-nums}

.treso{background:linear-gradient(145deg,#113050,#071425);border:1px solid var(--gold);position:relative;overflow:hidden}
.treso:after{content:"";position:absolute;top:-30px;right:-30px;width:150px;height:150px;
background:radial-gradient(circle,rgba(200,160,74,.16),transparent 68%)}
.big{font-family:var(--serif);font-size:33px;font-weight:700;letter-spacing:-.5px;margin:5px 0 1px}
.cur{font-size:13px;color:var(--gold);letter-spacing:1.5px;margin-left:5px;font-family:var(--sans)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.v{font-size:18px;font-weight:700;margin-top:3px}
.in{color:var(--ok)}.out{color:var(--bad)}.gd{color:var(--gold)}

.bar{height:6px;background:#071425;border:1px solid var(--line);border-radius:2px;overflow:hidden;margin-top:11px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--goldl))}
.brow{display:flex;justify-content:space-between;font-size:10.5px;color:var(--mut);margin-top:6px}

table{width:100%;border-collapse:collapse;font-size:12px}
th{font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut);text-align:left;
padding:7px 8px;border-bottom:1px solid var(--line);font-weight:700}
td{padding:9px 8px;border-bottom:1px solid #15283d}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}

.row{display:flex;align-items:center;gap:11px;background:var(--panel);border:1px solid var(--line);
border-radius:4px;padding:10px 12px;margin-bottom:6px;cursor:pointer}
.row:active{background:var(--panel2)}
.av{width:33px;height:33px;border-radius:3px;background:#0a1d30;border:1px solid var(--line);
display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--gold);flex:none}
.nm{font-size:12.5px;font-weight:600;line-height:1.3}
.meta{font-size:10.5px;color:var(--mut);margin-top:1px}
.tag{font-size:9px;font-weight:800;letter-spacing:.6px;padding:3px 7px;border-radius:3px;
white-space:nowrap;flex:none;text-transform:uppercase}
.t-ok{background:rgba(74,222,128,.12);color:var(--ok);border:1px solid rgba(74,222,128,.3)}
.t-pr{background:rgba(251,191,36,.12);color:var(--warn);border:1px solid rgba(251,191,36,.3)}
.t-rt{background:rgba(248,113,113,.12);color:var(--bad);border:1px solid rgba(248,113,113,.3)}
.t-nx{background:rgba(139,160,184,.12);color:var(--mut);border:1px solid var(--line)}

.search{position:relative;margin-bottom:9px}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:4px;
padding:12px 13px;color:var(--tx);font-size:14px;font-family:inherit;outline:none}
.search input:focus{border-color:var(--gold)}
.hint{font-size:10.5px;color:var(--mut);margin:0 0 10px 1px;line-height:1.6}

.months{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin:12px 0}
.mo{text-align:center;padding:7px 1px;border-radius:3px;background:#081626;border:1px solid var(--line)}
.mo b{display:block;font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.mo i{display:block;font-size:12px;margin-top:2px;font-style:normal;font-weight:800;color:#2c445e}
.mo.p{background:rgba(74,222,128,.08);border-color:rgba(74,222,128,.32)}
.mo.p i{color:var(--ok)}
.mo.d{border-color:rgba(248,113,113,.3)}
.mo.d i{color:var(--bad)}

.alert{border-left:3px solid var(--warn);background:rgba(251,191,36,.07);border-radius:3px;
padding:11px 12px;margin-bottom:7px}
.alert.bad{border-left-color:var(--bad);background:rgba(248,113,113,.07)}
.alert.ok{border-left-color:var(--ok);background:rgba(74,222,128,.07)}
.alert b{font-size:11.5px;letter-spacing:.3px;display:block}
.alert p{font-size:11px;color:var(--mut);margin-top:3px}

.act{display:flex;gap:7px;margin-top:10px}
.act button{flex:1;padding:10px;border-radius:3px;font-size:10.5px;font-weight:800;letter-spacing:1px;
text-transform:uppercase;font-family:inherit;cursor:pointer;border:1px solid}
.ap{background:rgba(74,222,128,.14);border-color:rgba(74,222,128,.4);color:var(--ok)}
.rj{background:rgba(248,113,113,.12);border-color:rgba(248,113,113,.35);color:var(--bad)}

.jl{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:10.5px;background:var(--panel);
border:1px solid var(--line);border-radius:4px;padding:10px 11px;margin-bottom:5px}
.jl .h{color:var(--gold);word-break:break-all;font-size:9.5px}
.jl .t{color:var(--mut);font-size:9.5px}

.inp{width:100%;background:#081626;border:1px solid var(--line);border-radius:3px;color:var(--tx);
padding:9px 10px;font-size:13px;font-family:var(--sans);outline:none;text-align:right}
.inp:focus{border-color:var(--gold)}
.frow{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.frow label{flex:1;font-size:12px;color:var(--mut)}
.frow .inp{width:135px;flex:none}

.sig{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.sigb{border:1px solid var(--line);border-radius:3px;padding:11px;text-align:center}
.sigb .lbl{margin-bottom:26px}
.sigb i{display:block;border-top:1px solid var(--line);font-style:normal;font-size:10px;
color:var(--mut);padding-top:5px}

nav{position:fixed;bottom:0;left:0;right:0;background:#071425;border-top:1px solid var(--gold);
display:flex;padding:5px 3px calc(5px + env(safe-area-inset-bottom));z-index:30}
nav button{flex:1;background:none;border:0;color:#6d8097;font-family:inherit;cursor:pointer;
padding:6px 2px;font-size:8.5px;letter-spacing:.6px;text-transform:uppercase;font-weight:700}
nav button i{display:block;font-size:15px;font-style:normal;margin-bottom:2px;line-height:1}
nav button.on{color:var(--gold)}

.sheet{position:fixed;inset:0;background:rgba(2,6,12,.76);z-index:60;display:none;
align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.panel{background:var(--navy2);border-top:2px solid var(--gold);border-radius:8px 8px 0 0;width:100%;
max-width:760px;padding:18px 15px 30px;max-height:90vh;overflow:auto}
.empty{text-align:center;color:var(--mut);font-size:12.5px;padding:28px 0}
footer{text-align:center;font-size:9.5px;color:#4e6079;margin:22px 0;letter-spacing:.8px;line-height:1.8}
@media print{nav,.badge,.act,#login{display:none}body{background:#fff;color:#000}}
</style>
</head>

<script>/* =========================================================================
   CAISSE LDSM — modèle commun
   Partagé par le poste Trésorier et le portail de consultation.
   Écrit en ES5 : le portail tourne aussi dans les WebView anciennes.
   ========================================================================= */

var MOIS = ["Janvier","Février","Mars","Avril","Mai","Juin",
            "Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
var MC   = ["Jan","Fév","Mar","Avr","Mai","Juin","Juil","Aoû","Sep","Oct","Nov","Déc"];

/* --- Échappement ---------------------------------------------------------
   Tout ce qui est inséré dans le DOM passe par esc(). Les valeurs placées
   dans un attribut onclick passent par uri() et sont redécodées au clic. */
var ESCM = {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"};
function esc(v){
  return String(v == null ? "" : v).replace(/[&<>"']/g, function(c){ return ESCM[c] });
}
function uri(v){ return encodeURIComponent(String(v == null ? "" : v)) }

function f(n){
  return Math.round(Number(n) || 0).toLocaleString("fr-FR").replace(/[  ]/g, " ");
}
function dfr(v){
  var t = Date.parse(v);
  return isNaN(t) ? esc(v) : new Date(t).toLocaleDateString("fr-FR");
}
function iso(d){
  d = d || new Date();
  function p(n){ return (n < 10 ? "0" : "") + n }
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}
function ini(n){
  return String(n || "").split(" ").filter(Boolean).slice(0, 2)
    .map(function(x){ return x.charAt(0) }).join("");
}

/* --- Pont Android --------------------------------------------------------
   Absent hors APK : le portail servi par le téléphone tourne dans un
   navigateur ordinaire et doit rester fonctionnel. */
function pont(){ return (typeof Android !== "undefined") ? Android : null }
function pontJson(nom){
  var A = pont();
  if (!A || !A[nom]) return [];
  try { return JSON.parse(A[nom]() || "[]") } catch (e) { return [] }
}
function estServeur(){
  var A = pont();
  try { return !!A && A.mode() === "serveur" } catch (e) { return false }
}

/* --- État courant -------------------------------------------------------- */
var DATA = null;
var M = [], DEPS = [], PEND = [], JOURNAL = [], RECUS = [];
var COT = 5000, ANNEE = 2026, ECHUS = 0;
var REC = 0, AUT = 0, DEP = 0, SOLDE = 0, ATT = 0, TAUX = 0, ARR = 0, PARMOIS = [];
var RECETTES = [], ACTIFS = [], DEFUNTS = [], ARR_DEFUNTS = 0;

var SCHEMA = 5;

/* LOT 3 — F3 : les mois échus se déduisent de la date, ils ne sont plus figés.
   En novembre de l'exercice courant : 11 mois échus. En janvier suivant : 12. */
/* Article 3.3 de la charte : la cotisation du mois est payable au plus tard
   le 10. Avant cette date, le mois courant n'est pas encore exigible et ne
   doit donc pas grossir les arriérés. */
function moisEchus(annee){
  var now = new Date();
  if (now.getFullYear() > annee) return 12;
  if (now.getFullYear() < annee) return 0;
  var n = now.getMonth() + 1;
  if (now.getDate() < 10) n -= 1;
  return Math.max(0, n);
}

/* Version installée, affichée en pied de page : sans elle, personne ne peut
   dire quelle version tourne sur quel téléphone, et tout dépannage devient
   une devinette. */
function versionApp(){
  var A = pont();
  if (A && A.version) { try { return A.version() || "—" } catch (e) { return "—" } }
  return "web";
}

/* --- Normalisation -------------------------------------------------------
   L'état peut venir du disque, d'une sauvegarde restaurée ou du réseau.
   On le traite comme hostile : types forcés, bornes, valeurs par défaut. */
function nombre(v, max){
  var n = Number(v);
  if (!isFinite(n) || n < 0) return 0;
  return Math.round(Math.min(n, max || 100000000));
}
function texte(v, max){ return String(v == null ? "" : v).slice(0, max || 120) }
function tableau(v, max){ return (Array.isArray(v)) ? v.slice(0, max) : [] }

function assainir(src){
  src = src || {};
  var d = {
    schema: Math.min(SCHEMA, Math.round(Number(src.schema) || 1)),
    annee:  Math.round(Number(src.annee) || 2026),
    cot:    Math.max(1, nombre(src.cot, 10000000)) || 5000,
    maj:    texte(src.maj, 40),
    seqRecu: Math.round(Number(src.seqRecu) || 0),
    membres: [], depenses: [], pending: [], recus: [], journal: [],
    references: [], aconfirmer: [], recettes: []
  };
  if (!d.cot) d.cot = 5000;

  tableau(src.membres, 2000).forEach(function(m, idx){
    m = m || {};
    var mois = [];
    for (var k = 0; k < 12; k++) {
      mois.push(nombre(Array.isArray(m.m) ? m.m[k] : 0));
    }
    d.membres.push({
      id: Math.round(Number(m.id) || (idx + 1)),
      nom: texte(m.nom),
      m: mois,
      /* Un camarade qui nous quitte ne s'efface pas du registre : ses
         versements sont dans la caisse et doivent y rester pour que les
         comptes se bouclent. Il cesse simplement de devoir. */
      statut: (m.statut === "defunt") ? "defunt" : "",
      dateDeces: texte(m.dateDeces, 30)
    });
  });

  tableau(src.depenses, 1000).forEach(function(x, i){
    x = x || {};
    d.depenses.push({
      id: texte(x.id, 24) || ("S-" + d.annee + "-" + (i + 1)),
      date: texte(x.date, 30),
      ben: texte(x.ben),
      ev: texte(x.ev, 40),
      mt: nombre(x.mt),
      parQui: texte(x.parQui, 40),
      idm: Math.round(Number(x.idm) || 0) || "",
      annule: !!x.annule,
      motifAnnulation: texte(x.motifAnnulation, 300),
      dateAnnulation: texte(x.dateAnnulation, 30)
    });
  });

  tableau(src.pending, 200).forEach(function(x, i){
    x = x || {};
    d.pending.push({
      id: texte(x.id, 24) || ("S-" + d.annee + "-P" + (i + 1)),
      date: texte(x.date, 30),
      ben: texte(x.ben),
      ev: texte(x.ev, 40),
      mt: nombre(x.mt),
      par: texte(x.par, 40) || "Trésorier",
      idm: Math.round(Number(x.idm) || 0) || ""
    });
  });

  tableau(src.recus, 5000).forEach(function(r){
    r = r || {};
    var rec = {
      n: texte(r.n, 24),
      idm: Math.round(Number(r.idm) || 0),
      mois: Math.min(11, Math.max(0, Math.round(Number(r.mois) || 0))),
      mt: nombre(r.mt),
      date: texte(r.date, 30)
    };
    /* Un reçu annulé ou corrigé n'est jamais retiré : son état doit survivre
       à la normalisation, sinon la trace de la correction disparaîtrait. */
    if (r.annule) { rec.annule = true; rec.motif = texte(r.motif, 300);
                    rec.dateAnnulation = texte(r.dateAnnulation, 30) }
    if (r.corrige) { rec.corrige = texte(r.corrige, 300);
                     rec.dateCorrection = texte(r.dateCorrection, 30) }
    d.recus.push(rec);
  });

  /* Références des reçus déjà imputés : garde-fou contre le double comptage. */
  tableau(src.references, 5000).forEach(function(r){
    var t = texte(r, 60); if (t) d.references.push(t);
  });

  tableau(src.journal, 5000).forEach(function(j){
    j = j || {};
    d.journal.push({
      d: texte(j.d, 30),
      l: texte(j.l, 200),
      mt: Math.round(Number(j.mt) || 0),
      a: texte(j.a, 40),
      p: texte(j.p, 80),
      h: texte(j.h, 80)
    });
  });

  /* Recettes qui ne sont pas des cotisations : don, remboursement,
     contribution exceptionnelle. Elles entrent en caisse mais ne doivent
     jamais gonfler le taux de recouvrement, qui mesure ce que les membres
     ont versé sur ce qu'ils devaient. */
  tableau(src.recettes, 1000).forEach(function(x){
    x = x || {};
    var r = {
      id: texte(x.id, 40),
      date: texte(x.date, 30),
      lib: texte(x.lib, 200),
      mt: nombre(x.mt),
      par: texte(x.par, 80) || "Trésorier",
      annule: !!x.annule,
      motifAnnulation: texte(x.motifAnnulation, 300)
    };
    if (r.id && r.mt > 0) d.recettes.push(r);
  });

  /* Opérations portées à la confirmation du Président (art. 7 de la charte :
     rien qui ne soit validé par le Bureau). L'opération est inscrite tout de
     suite — le Trésorier ne peut pas tenir une caisse à l'arrêt — mais elle
     reste marquée tant que le Président ne l'a pas confirmée. */
  tableau(src.aconfirmer, 2000).forEach(function(x){
    x = x || {};
    var e = {
      id: texte(x.id, 40),
      genre: texte(x.genre, 24),
      libelle: texte(x.libelle, 200),
      mt: nombre(x.mt),
      date: texte(x.date, 30),
      par: texte(x.par, 80),
      qualite: texte(x.qualite, 24),
      idm: Math.round(Number(x.idm) || 0) || "",
      nom: texte(x.nom)
    };
    if (x.mois !== undefined && x.mois !== "") e.mois = Math.round(Number(x.mois) || 0);
    if (e.id && e.genre) d.aconfirmer.push(e);
  });

  return d;
}

/* --- Calculs ------------------------------------------------------------- */
function statut(paye, ret){
  if (paye === 0) return "nx";
  if (ret === 0) return "ok";
  return ret <= 2 * COT ? "pr" : "rt";
}

function compute(){
  DATA = assainir(DATA);
  COT = DATA.cot;
  ANNEE = DATA.annee;
  ECHUS = moisEchus(ANNEE);

  M = DATA.membres.map(function(m){
    var paye = 0;
    for (var k = 0; k < 12; k++) paye += m.m[k];
    var du = ECHUS * COT;
    var ret = Math.max(0, du - paye);
    var nb = m.m.filter(function(v){ return v > 0 }).length;
    return { id:m.id, nom:m.nom, m:m.m, paye:paye, ret:ret, nb:nb,
             statut: m.statut || "", dateDeces: m.dateDeces || "",
             st: m.statut === "defunt" ? "df" : statut(paye, ret) };
  });

  DEPS = DATA.depenses.filter(function(d){ return !d.annule });
  DEPS_TOUT = DATA.depenses;
  PEND = DATA.pending;
  ACONF = DATA.aconfirmer;
  JOURNAL = DATA.journal;
  RECUS = DATA.recus;

  RECETTES = DATA.recettes.filter(function(r){ return !r.annule });
  DEFUNTS = M.filter(function(m){ return m.statut === "defunt" });
  ACTIFS = M.filter(function(m){ return m.statut !== "defunt" });
  /* Les versements d'un défunt restent acquis à la caisse ; ce qu'il aurait
     dû verser ensuite n'est plus attendu de lui. */
  REC = M.reduce(function(a, b){ return a + b.paye }, 0);
  AUT = RECETTES.reduce(function(a, b){ return a + b.mt }, 0);
  DEP = DEPS.reduce(function(a, b){ return a + b.mt }, 0);
  SOLDE = REC + AUT - DEP;
  ATT = ACTIFS.length * ECHUS * COT;
  /* Le taux de recouvrement porte sur les seules cotisations : un don ne
     rattrape pas un retard de cotisation, et l'afficher comme tel donnerait
     au Bureau une image fausse de la discipline de la promotion. */
  TAUX = ATT ? REC / ATT * 100 : 0;
  ARR = ACTIFS.reduce(function(a, b){ return a + b.ret }, 0);
  /* L'arriéré laissé par un défunt est isolé : au Bureau de décider s'il
     l'abandonne, pas à l'application de le gommer en silence. */
  ARR_DEFUNTS = DEFUNTS.reduce(function(a, b){ return a + b.ret }, 0);
  PARMOIS = MOIS.map(function(_, k){
    return M.reduce(function(a, b){ return a + b.m[k] }, 0);
  });
}

/* --- Comptages ----------------------------------------------------------
   Une seule source pour tous les écrans. Les chiffres divergeaient parce que
   chacun recomptait à sa façon : l'un sur M, l'autre sur les statuts, et un
   camarade décédé apparaissait dans l'effectif sans apparaître dans aucune
   des trois catégories. 138, 137, 92, 91 et 90 coexistaient.

   Règle : tout ce qui se compte se compte sur les membres actifs. Les
   recherches par nom ou par identifiant, elles, portent sur M entier — un
   défunt doit rester consultable. */
function nbEffectif(){ return ACTIFS.length }
function nbAJour(){ return ACTIFS.filter(function(m){ return m.ret === 0 }).length }
function nbRetard(){ return ACTIFS.filter(function(m){ return m.ret > 0 }).length }
function nbPartiel(){ return ACTIFS.filter(function(m){ return m.st === "pr" }).length }
function nbNeant(){ return ACTIFS.filter(function(m){ return m.st === "nx" }).length }
function nbSuspendus(){ return ACTIFS.filter(droitsSuspendus).length }

/* Article 3.3 : la cotisation du mois est due le 10. Article 3.4 : au-delà de
   deux mois de retard, les droits sont suspendus. Ces deux fonctions vivent
   ici et non dans charte.js, parce que la page publiée les utilise sans
   charger les règles d'éligibilité. */
function moisRetard(m){
  if (!m || !COT) return 0;
  return Math.floor(m.ret / COT);
}
function retardPartiel(m){
  if (!m || !COT) return 0;
  return m.ret - moisRetard(m) * COT;
}
function droitsSuspendus(m){ return moisRetard(m) > 2 }

/* --- Passage d'un tableau à l'autre -------------------------------------
   Un compteur qui annonce « 91 retardataires » doit mener aux 91 noms. Sans
   cela on lit un chiffre sans pouvoir le vérifier, et c'est ainsi qu'une
   incohérence passe inaperçue des semaines. */
var FILTRE_ST = "";
function voirGroupe(st){
  FILTRE_ST = (FILTRE_ST === st) ? "" : st;
  if (typeof go === "function") go("mem"); else if (typeof rendre === "function") rendre();
}
function filtrer(liste){
  if (!FILTRE_ST) return liste;
  if (FILTRE_ST === "rt") return liste.filter(function(m){ return m.ret > 0 });
  return liste.filter(function(m){ return m.st === FILTRE_ST });
}
function nomGroupe(st){
  return st === "ok" ? "à jour" : st === "rt" ? "en retard"
       : st === "pr" ? "partiellement à jour" : st === "nx" ? "n'ayant rien versé"
       : st === "df" ? "disparus" : "";
}
function bandeauFiltre(){
  if (!FILTRE_ST) return "";
  return '<div class="alert" style="padding:8px 11px"><b>Membres ' +
    nomGroupe(FILTRE_ST) + '</b> <span class="tag t-nx" style="cursor:pointer;' +
    'margin-left:6px" onclick="voirGroupe(\'' + FILTRE_ST + '\')">Tout afficher</span></div>';
}

function libelleStatut(m){
  if (m.st === "df") return "Décédé";
  if (m.st === "ok") return "À jour";
  if (m.st === "nx") return "Néant";
  return f(m.ret) + " F dus";
}

/* --- Barème statutaire --------------------------------------------------- */
var DEPS_TOUT = [], ACONF = [];
var BAREME = [
  { ev: "MARIAGE", mt: 200000, lib: "Mariage" },

function montantBareme(ev){
  for (var i = 0; i < BAREME.length; i++) if (BAREME[i].ev === ev) return BAREME[i].mt;
  return 0;
}

/* =========================================================================
   CAISSE LDSM — page publiée sur internet
   Adresse fixe, consultable de n'importe où, sans rien installer.

   La page est publique, son contenu ne l'est pas : le registre est chiffré
   en AES-256-GCM, la clé dérivée du mot de passe de la promotion par
   PBKDF2. L'hébergeur ne détient que du chiffré. Le déchiffrement se fait
   dans le navigateur du membre, jamais ailleurs.
   ========================================================================= */

var SRC = "web", ROUTE = "";
var ITERATIONS = 100000;

function b64vers(bin){
  var s = atob(bin), a = new Uint8Array(s.length);
  for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i);
  return a;
}

function dechiffrer(blob, phrase){
  var brut = b64vers(blob);
  var sel = brut.slice(0, 16), iv = brut.slice(16, 28), corps = brut.slice(28);
  var enc = new TextEncoder();
  return crypto.subtle.importKey("raw", enc.encode(phrase), "PBKDF2", false, ["deriveKey"])
    .then(function(km){
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: sel, iterations: ITERATIONS, hash: "SHA-256" },
        km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    })
    .then(function(cle){
      return crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, cle, corps);
    })
    .then(function(clair){
      return JSON.parse(new TextDecoder().decode(clair));
    });
}

/* Le mot de passe est retenu dans le navigateur : on ne le redemande pas
   à chaque visite. */
function phraseRetenue(){
  try { return localStorage.getItem("phrase") || "" } catch (e) { return "" }
}
function retenirPhrase(p){
  try { localStorage.setItem("phrase", p) } catch (e) { }
}
function oublierPhrase(){
  try { localStorage.removeItem("phrase") } catch (e) { }
  location.reload();
}

function ecranVerrou(message){
  document.getElementById("view").innerHTML =
    '<div class="card treso" style="text-align:center;margin-top:30px">' +
    '<div class="lbl">Caisse de la 19<sup>e</sup> promotion</div>' +
    '<div style="font-family:var(--serif);font-size:19px;margin:10px 0 4px">Accès réservé</div>' +
    '<div class="hint" style="margin:0 0 14px">Saisissez le mot de passe communiqué ' +
    'par le Trésorier. Il n\'est demandé qu\'une fois sur ce téléphone.</div>' +
    '<input class="inp" id="mp" type="password" style="text-align:center" ' +
    'placeholder="mot de passe" autocomplete="current-password">' +
    (message ? '<div style="color:var(--bad);font-size:11.5px;margin-top:8px">' +
               esc(message) + '</div>' : '') +
    '<button class="btn" onclick="ouvrirAvecPhrase()">Entrer</button></div>' +
    '<footer>CAISSE LDSM · 19<sup>e</sup> PROMOTION EFO<br>Consultation — diffusion restreinte</footer>';
  var champ = document.getElementById("mp");
  champ.addEventListener("keydown", function(e){ if (e.key === "Enter") ouvrirAvecPhrase() });
  champ.focus();
  document.getElementById("nav").style.display = "none";
}

function ouvrirAvecPhrase(){
  var p = document.getElementById("mp").value;
  if (!p) return;
  document.getElementById("mp").disabled = true;
  charger(p, true);
}

function charger(phrase, interactif){
  if (!window.crypto || !crypto.subtle) {
    ecranVerrou("Ce navigateur ne sait pas déchiffrer. Ouvrez la page en https.");
    return;
  }
  dechiffrer(BLOB, phrase).then(function(etat){
    retenirPhrase(phrase);
    DATA = etat;
    compute();
    document.getElementById("nav").style.display = "";
    document.getElementById("st").className = "st on";
    document.getElementById("st").textContent = "À jour";
    go("dash");
  }).catch(function(){
    if (interactif) ecranVerrou("Mot de passe incorrect.");
    else ecranVerrou("");
  });
}
